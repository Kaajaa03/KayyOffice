<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
  <title>Kayy Office</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1422; --card:#18202e; --line:#2a3550; --text:#e5e7eb; --dim:#9ca3af; --gold:#ffd43b; --green:#69db7c; --red:#ff6b6b; }
    * { box-sizing: border-box; }
    html { background:var(--bg); }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI", system-ui, sans-serif; padding:20px 28px 16px; overflow-y:auto; }
    h1 { margin:0 0 12px; font-size:22px; letter-spacing:.2px; }
    h1 span { color:var(--gold); }
    section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px 14px; margin-bottom:12px; }
    h2 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--gold); }
    fieldset { border:0; margin:0 0 10px; padding:0; min-width:0; }
    fieldset:last-child { margin-bottom:0; }
    legend, .label { padding:0; margin:0 0 4px; font-weight:600; display:flex; justify-content:space-between; width:100%; }
    legend output, .label output { color:var(--gold); font-weight:600; font-variant-numeric:tabular-nums; }
    .hint { color:var(--dim); font-size:12.5px; margin:4px 0 0; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px 0; }
    .row .what { min-width:0; }
    .status i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--dim); margin-right:8px; }
    .status.ok i { background:var(--green); }
    .status.bad i { background:var(--red); }
    .status.ok { color:var(--text); }

    /* segmented radios and the position grid: real radio inputs, styled labels */
    .seg { display:flex; gap:0; }
    .seg label, .grid label { position:relative; flex:1; text-align:center; padding:6px 4px; border:1px solid var(--line); background:#121a29; cursor:pointer; font-size:13px; user-select:none; }
    .seg label:first-of-type { border-radius:8px 0 0 8px; }
    .seg label:last-of-type { border-radius:0 8px 8px 0; }
    .seg label + label { margin-left:-1px; }
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
    .grid label { border-radius:8px; }
    input.pick { position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer; }
    label:has(input.pick:checked) { background:var(--gold); color:#0b1020; border-color:var(--gold); font-weight:700; }
    label:has(input.pick:focus-visible) { outline:2px solid var(--text); outline-offset:2px; z-index:1; }
    label:has(input.pick:disabled) { opacity:.5; cursor:default; }

    /* radio list with a sentence each */
    .opt { display:flex; gap:10px; align-items:flex-start; padding:6px 8px; border-radius:8px; cursor:pointer; }
    .opt:hover { background:#1d2738; }
    .opt input { margin:4px 0 0; accent-color:var(--gold); flex:none; width:16px; height:16px; }
    .opt:has(input:focus-visible) { outline:2px solid var(--text); outline-offset:1px; }
    .opt b { display:block; font-weight:600; }
    .opt span { display:block; color:var(--dim); font-size:12.5px; }

    input[type=range] { width:100%; accent-color:var(--gold); margin:4px 0 0; height:22px; }
    input[type=range]:focus-visible { outline:2px solid var(--text); outline-offset:2px; border-radius:4px; }

    /* switch: a checkbox with a track */
    .switch { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px 0; cursor:pointer; }
    .switch input { appearance:none; flex:none; width:38px; height:22px; border-radius:11px; background:#2a3550; position:relative; margin:0; cursor:pointer; transition:background .15s; }
    .switch input::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:var(--text); transition:left .15s; }
    .switch input:checked { background:var(--gold); }
    .switch input:checked::after { left:19px; background:#0b1020; }
    .switch input:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
    .switch input:disabled { opacity:.45; cursor:default; }

    button { font:600 13px "Segoe UI", sans-serif; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; background:transparent; color:var(--text); }
    button.primary { background:var(--gold); color:#0b1020; border-color:var(--gold); }
    button:hover { filter:brightness(1.15); }
    button:focus-visible { outline:2px solid var(--text); outline-offset:2px; }
    .btns { display:flex; flex-wrap:wrap; gap:8px; }
    .btns button { flex:1 1 150px; }
    .msg { margin-top:8px; font-size:13px; white-space:pre-wrap; color:var(--green); }
    .msg.err { color:var(--red); }
    .msg:empty { display:none; }
    .intro { border-color:var(--gold); display:flex; gap:12px; align-items:center; justify-content:space-between; }
    .intro[hidden] { display:none; }
    .intro p { margin:0; }
    footer { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--dim); font-size:12.5px; padding:2px 4px 0; }
    kbd { background:#0b1020; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font:12px Consolas, monospace; }
  </style>
</head>
<body>
  <h1><span data-i18n="set.title"></span> <span>●</span></h1>
  <section class="intro" id="intro" hidden>
    <p data-i18n="set.intro"></p>
    <button id="intro-close" class="primary" data-i18n="set.intro.close"></button>
  </section>
  <div class="msg err" id="load-error" role="alert"></div>

  <section aria-labelledby="h-display">
    <h2 id="h-display" data-i18n="set.sec.display"></h2>

    <fieldset>
      <legend data-i18n="set.language"></legend>
      <div class="seg" id="g-language" data-i18n-title="set.language.title">
        <label><input class="pick" type="radio" name="language" value="de" />Deutsch</label>
        <label><input class="pick" type="radio" name="language" value="en" />English</label>
      </div>
    </fieldset>

    <fieldset>
      <legend><span data-i18n="set.size"></span><output id="size-out" for="g-size"></output></legend>
      <div class="seg" id="g-size" data-i18n-title="set.size.title">
        <label><input class="pick" type="radio" name="scale" value="0.67" />67 %</label>
        <label><input class="pick" type="radio" name="scale" value="1" />100 %</label>
        <label><input class="pick" type="radio" name="scale" value="1.33" />133 %</label>
        <label><input class="pick" type="radio" name="scale" value="1.67" />167 %</label>
        <label><input class="pick" type="radio" name="scale" value="2" />200 %</label>
      </div>
      <p class="hint" data-i18n="set.size.hint"></p>
    </fieldset>

    <div>
      <label class="label" for="opacity"><span data-i18n="set.opacity"></span><output id="opacity-out" for="opacity"></output></label>
      <input id="opacity" type="range" min="50" max="100" step="5" data-i18n-title="set.opacity.title" />
      <p class="hint" data-i18n="set.opacity.hint"></p>
    </div>
  </section>

  <section aria-labelledby="h-position">
    <h2 id="h-position" data-i18n="set.sec.position"></h2>
    <fieldset aria-labelledby="h-position">
      <div class="grid" id="g-placement" data-i18n-title="set.pos.title">
        <label><input class="pick" type="radio" name="placement" value="top-left" /><span data-i18n="set.pos.top-left"></span></label>
        <label><input class="pick" type="radio" name="placement" value="top-center" /><span data-i18n="set.pos.top-center"></span></label>
        <label><input class="pick" type="radio" name="placement" value="top-right" /><span data-i18n="set.pos.top-right"></span></label>
        <label><input class="pick" type="radio" name="placement" value="bottom-left" /><span data-i18n="set.pos.bottom-left"></span></label>
        <label><input class="pick" type="radio" name="placement" value="bottom-center" /><span data-i18n="set.pos.bottom-center"></span></label>
        <label><input class="pick" type="radio" name="placement" value="bottom-right" /><span data-i18n="set.pos.bottom-right"></span></label>
      </div>
      <p class="hint" data-i18n="set.pos.hint"></p>
    </fieldset>
  </section>

  <section aria-labelledby="h-approvals">
    <h2 id="h-approvals" data-i18n="set.sec.approvals"></h2>
    <fieldset aria-labelledby="h-approvals">
      <label class="opt"><input type="radio" name="approvals" value="risky" /><div><b data-i18n="set.approvals.risky"></b><span data-i18n="set.approvals.risky.text"></span></div></label>
      <label class="opt"><input type="radio" name="approvals" value="all" /><div><b data-i18n="set.approvals.all"></b><span data-i18n="set.approvals.all.text"></span></div></label>
      <label class="opt"><input type="radio" name="approvals" value="off" /><div><b data-i18n="set.approvals.off"></b><span data-i18n="set.approvals.off.text"></span></div></label>
    </fieldset>
    <p class="hint" data-i18n="set.approvals.note"></p>
  </section>

  <section aria-labelledby="h-connection">
    <h2 id="h-connection" data-i18n="set.sec.connection"></h2>
    <div class="row">
      <div class="status" id="s-hooks"><i></i><span></span></div>
      <div class="btns">
        <button id="hooks-install" class="primary" data-i18n="set.hooks.install" data-i18n-title="set.hooks.install.title"></button>
        <button id="hooks-remove" data-i18n="set.hooks.remove" data-i18n-title="set.hooks.remove.title"></button>
      </div>
    </div>
    <div class="msg" id="m-hooks" role="status"></div>
    <p class="hint" data-i18n="set.hooks.hint"></p>
    <div class="row"><div class="status" id="s-mod" data-i18n-title="set.mod.hint"><i></i><span></span></div></div>
    <p class="hint" data-i18n="set.mod.hint"></p>
    <div class="row"><div class="status" id="s-port"><i></i><span></span></div></div>
  </section>

  <section aria-labelledby="h-system">
    <h2 id="h-system" data-i18n="set.sec.system"></h2>
    <label class="switch" id="w-autostart"><span data-i18n="set.autostart"></span><input id="autostart" type="checkbox" role="switch" /></label>
    <p class="hint" id="autostart-note"></p>
    <label class="switch" data-i18n-title="set.awake.title"><span data-i18n="set.awake"></span><input id="awake" type="checkbox" role="switch" /></label>
  </section>

  <section aria-labelledby="h-tools">
    <h2 id="h-tools" data-i18n="set.sec.tools"></h2>
    <div class="btns">
      <button data-action="demo" data-i18n="set.tool.demo" data-i18n-title="set.tool.demo.title"></button>
      <button data-action="devlog" data-i18n="set.tool.devlog" data-i18n-title="set.tool.devlog.title"></button>
      <button data-action="week" data-i18n="set.tool.week" data-i18n-title="set.tool.week.title"></button>
      <button data-action="roles" data-i18n="set.tool.roles" data-i18n-title="set.tool.roles.title"></button>
      <button data-action="diag" data-i18n="set.tool.diag" data-i18n-title="set.tool.diag.title"></button>
    </div>
    <div class="msg" id="m-tools" role="status"></div>
  </section>

  <footer>
    <span id="f-version"></span>
    <span id="f-hotkey"></span>
    <span data-i18n="set.hintEsc"></span>
  </footer>
  <script src="settings.js"></script>
</body>
</html>

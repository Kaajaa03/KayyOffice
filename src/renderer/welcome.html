<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
  <title>Kayy Office</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1422; --card:#18202e; --line:#2a3550; --text:#e5e7eb; --dim:#9ca3af; --gold:#ffd43b; --green:#69db7c; --red:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 "Segoe UI", system-ui, sans-serif; padding:22px 30px 18px; }
    h1 { margin:0 0 4px; font-size:22px; letter-spacing:.2px; }
    h1 span { color:var(--gold); }
    .sub { color:var(--dim); margin:0 0 12px; }
    .status { display:flex; flex-wrap:wrap; gap:6px 16px; margin:0 0 14px; padding:8px 14px; border:1px solid var(--line); border-radius:10px; background:#121a29; font-size:13px; }
    .status div { display:flex; align-items:center; gap:7px; color:var(--dim); }
    .status i { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; }
    .status .ok i { background:var(--green); }
    .status .bad i { background:var(--red); }
    .status .ok { color:var(--text); }
    .step { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:10px; display:flex; gap:14px; align-items:flex-start; }
    .n { flex:none; width:26px; height:26px; border-radius:8px; background:var(--gold); color:#0b1020; font-weight:800; display:grid; place-items:center; }
    .step h2 { margin:0 0 2px; font-size:15px; }
    .step p { margin:0 0 10px; color:var(--dim); }
    button { font:600 13px "Segoe UI", sans-serif; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; background:var(--gold); color:#0b1020; }
    button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
    button:hover { filter:brightness(1.1); }
    .msg { margin-top:8px; color:var(--green); font-size:13px; white-space:pre-wrap; }
    .msg:empty { display:none; }
    .step > div:last-child { flex:1; }
    body { overflow-y:auto; }
    kbd { background:#0b1020; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font:12px Consolas, monospace; }
    .foot { display:flex; justify-content:flex-end; margin-top:12px; }
  </style>
</head>
<body>
  <h1>Kayy Office <span>●</span></h1>
  <p class="sub" data-i18n="welcome.sub"></p>

  <div class="status" id="status">
    <div id="s-hooks"><i></i><span></span></div>
    <div id="s-mode"><i></i><span></span></div>
    <div id="s-port"><i></i><span></span></div>
  </div>

  <div class="step"><div class="n">1</div><div>
    <h2 data-i18n="welcome.step1.title"></h2>
    <p data-i18n-html="welcome.step1.textHtml"></p>
    <button id="hooks" data-i18n="welcome.step1.button"></button>
    <div class="msg" id="m1"></div>
  </div></div>

  <div class="step"><div class="n">2</div><div>
    <h2 data-i18n="welcome.step2.title"></h2>
    <p data-i18n="welcome.step2.text"></p>
    <button id="demo" class="ghost" data-i18n="welcome.step2.button"></button>
    <div class="msg" id="m2"></div>
  </div></div>

  <div class="step"><div class="n">3</div><div>
    <h2 data-i18n="welcome.step3.title"></h2>
    <p data-i18n-html="welcome.step3.textHtml"></p>
  </div></div>

  <div class="foot"><button id="close" data-i18n="welcome.close"></button></div>
  <script src="welcome.js"></script>
</body>
</html>

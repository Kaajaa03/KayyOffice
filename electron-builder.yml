appId: dev.kayy.office
productName: Kayy Office
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: hook
    to: hook
  - from: build/icon.ico
    to: icon.ico
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  signExecutable: false
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
